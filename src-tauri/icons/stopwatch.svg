<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="face" x1="256" y1="64" x2="256" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F3F5"/>
    </linearGradient>
    <linearGradient id="ring" x1="256" y1="48" x2="256" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#222F3E"/>
      <stop offset="1" stop-color="#0B1118"/>
    </linearGradient>
    <linearGradient id="accent" x1="256" y1="40" x2="256" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3DA5FF"/>
      <stop offset="1" stop-color="#1B6EDC"/>
    </linearGradient>
  </defs>

  <!-- Top button -->
  <rect x="206" y="20" width="100" height="42" rx="10" fill="url(#accent)"/>
  <rect x="230" y="58" width="52" height="20" rx="8" fill="#111827"/>

  <!-- Crown -->
  <rect x="238" y="84" width="36" height="20" rx="6" fill="#111827"/>

  <!-- Outer ring -->
  <circle cx="256" cy="280" r="190" fill="url(#ring)"/>
  <circle cx="256" cy="280" r="165" fill="url(#face)"/>

  <!-- Minute marks -->
  <g stroke="#9CA3AF" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="118" x2="256" y2="132"/>
    <line x1="256" y1="428" x2="256" y2="442"/>
    <line x1="94" y1="280" x2="108" y2="280"/>
    <line x1="404" y1="280" x2="418" y2="280"/>
    <line x1="149" y1="173" x2="160" y2="184"/>
    <line x1="352" y1="376" x2="363" y2="387"/>
    <line x1="149" y1="387" x2="160" y2="376"/>
    <line x1="352" y1="184" x2="363" y2="173"/>
  </g>

  <!-- Hands -->
  <line x1="256" y1="280" x2="256" y2="190" stroke="#111827" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="280" x2="326" y2="310" stroke="#1B6EDC" stroke-width="8" stroke-linecap="round"/>

  <!-- Center cap -->
  <circle cx="256" cy="280" r="12" fill="#111827"/>
  <circle cx="256" cy="280" r="5" fill="#FFFFFF"/>
</svg>
